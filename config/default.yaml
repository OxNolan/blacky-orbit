mimo:
  api_url: https://api.xiaomimimo.com/v1
  model_primary: mimo-v2.5-pro
  model_secondary: mimo-v2.5
  max_tokens_per_request: 32000
  rate_limit_rps: 50
  timeout_seconds: 60
  retry_max_attempts: 3

hermes:
  framework: hermes-agent
  delegation_max_depth: 2
  memory_backend: sqlite
  memory_path: ./data/hermes-memory.db

logging:
  level: INFO
  format: json
  output: logs/blacky-orbit.log

agents:
  orchestrator:
    enabled: true
    model: mimo-v2.5-pro
    concurrency: 8
    decision_timeout: 30s

  hunter:
    enabled: true
    model: mimo-v2.5-pro
    sources:
      - galxe
      - layer3
      - zealy
      - defillama
      - x_alpha_feeds
    poll_interval: 5m
    max_items_per_cycle: 50

  eligibility:
    enabled: true
    model: mimo-v2.5-pro
    chains:
      - ethereum
      - base
      - arbitrum
      - optimism
      - linea
      - zksync
      - scroll
      - polygon
    cache_ttl: 1h

  guardian:
    enabled: true
    model: mimo-v2.5-pro
    passes: 4
    min_confidence: 0.85
    sybil_heuristics:
      - layerzero
      - zksync
      - linea
      - arbitrum_stip

  chain:
    enabled: true
    model: mimo-v2.5
    simulate_before_send: true
    gas_safety_margin: 1.2
    slippage_max_pct: 1.0

  coder:
    enabled: true
    model: mimo-v2.5-pro
    tdd_iterations: 5
    refactor_passes: 2

  reviewer:
    enabled: true
    model: mimo-v2.5
    security_rules: owasp-2025
    block_on_critical: true

  scribe:
    enabled: true
    model: mimo-v2.5
    output: obsidian
    daily_summary_time: "09:00"
